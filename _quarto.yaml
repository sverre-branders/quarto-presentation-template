project:
  type: website
  output-dir: _site

website:
  title: "My Presentation"

presentation-title: "Title"
presentation-subtitle: "Subtitle"
presenter: "Sverre Branders"
presenter-title: "Postdoctoral Research Fellow"
presenter-university: "University of Oslo"
